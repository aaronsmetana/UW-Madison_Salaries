<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The browser's own bar in the header's colour, per scheme, so the two read as one surface. -->
    <meta name="theme-color" content="#FCFCFD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1113" media="(prefers-color-scheme: dark)" />
    <!-- The mark (scripts/brand-images.mjs writes it from src/components/brandMark.json). -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://aaronsmetana.github.io/UW-Madison_Salaries/" />
    <!-- Self-hosted (see the @font-face block in src/styles/app.css). Preload only the `latin`
         subset: it covers effectively all UI chrome, so it is on the critical path, while latin-ext
         and vietnamese load on demand for names that need them. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/hanken-grotesk-latin.woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Explore UW–Madison salary data across snapshots — search people, compare salaries and titles, view trends by school. Public-record data."
    />
    <title>UW–Madison Salaries</title>

    <!-- Social cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UW–Madison Salaries" />
    <meta property="og:title" content="UW–Madison Salaries" />
    <meta
      property="og:description"
      content="Search, compare, and explore public-record salary data across UW–Madison — by person, title, and school."
    />
    <meta property="og:url" content="https://aaronsmetana.github.io/UW-Madison_Salaries/" />
    <meta property="og:image" content="https://aaronsmetana.github.io/UW-Madison_Salaries/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UW–Madison Salaries" />
    <meta
      name="twitter:description"
      content="Search, compare, and explore public-record salary data across UW–Madison — by person, title, and school."
    />
    <meta name="twitter:image" content="https://aaronsmetana.github.io/UW-Madison_Salaries/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
